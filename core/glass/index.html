<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JARVIS</title>
  <style>
    :root {
      --bg: #07090b;
      --ink: #e8eef2;
      --muted: #8b98a5;
      --teal: #5eead4;
      --steel: #3d4a55;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
    header {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 18px 28px; border-bottom: 1px solid var(--steel);
    }
    .mark { letter-spacing: 0.28em; color: var(--teal); font-size: 12px; font-weight: 500; }
    nav { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
    nav b { color: var(--ink); font-weight: 500; }
    .shell {
      display: grid; grid-template-columns: 1fr 320px; min-height: calc(100% - 88px);
    }
    .stage { padding: 36px 40px; }
    .stage h2 { margin: 0 0 8px; font-size: 22px; font-weight: 500; }
    .stage p { color: var(--muted); max-width: 36em; }
    .dock {
      border-left: 1px solid var(--steel); padding: 28px 24px; color: var(--muted);
    }
    .dock h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.16em; color: var(--steel); }
    footer {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 10px 28px; border-top: 1px solid var(--steel);
      font: 13px/1.3 "IBM Plex Mono", ui-monospace, monospace;
      background: var(--bg);
    }
    footer a { color: var(--teal); text-decoration: none; }
    .ok { color: var(--teal); }
    .deg { color: var(--warn); }
  </style>
</head>
<body>
  <header>
    <div class="mark">JARVIS</div>
    <nav><b>briefing</b> · life · globe · forge</nav>
  </header>
  <div class="shell">
    <section class="stage">
      <h2>Good afternoon.</h2>
      <p>This is the product glass. Calendar, mail, and voice land here next.
         House detail lives on <a href="https://noc.lan" style="color:#5eead4">noc.lan</a>.</p>
    </section>
    <aside class="dock">
      <h3>DOCK</h3>
      <p>Conversation and confirm live here. Not this slice.</p>
    </aside>
  </div>
  <footer>
    <span id="pulse">pulse…</span>
  </footer>
  <script>
    async function tick() {
      const el = document.getElementById("pulse");
      try {
        const s = await (await fetch("/api/pulse", { cache: "no-store" })).json();
        el.className = s.house === "ok" ? "ok" : "deg";
        const link = s.house === "ok"
          ? s.line
          : s.line + ' · <a href="https://noc.lan">noc.lan</a>';
        el.innerHTML = link;
      } catch (e) {
        el.className = "deg";
        el.textContent = "pulse failed";
      }
    }
    tick();
    setInterval(tick, 5000);
  </script>
</body>
</html>

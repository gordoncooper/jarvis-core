# Apply from agent@bastion. Flux must not own this file.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jarvis-core
  namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-core
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: jarvis-core }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: jarvis-core }
    spec:
      serviceAccountName: jarvis-core
      nodeSelector:
        jarvis.role: apps
      containers:
        - name: glass
          image: docker.io/library/jarvis-core:v0.2.0
          imagePullPolicy: Never
          env:
            - name: CORE_VERSION
              value: v0.2.0
            - name: NOC_SNAPSHOT_URL
              value: http://jarvis-noc.apps.svc.cluster.local:8080/api/snapshot
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-core
  namespace: apps
spec:
  selector: { app: jarvis-core }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarvis-core
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jarvis.lan]
      secretName: lan-tls
  rules:
    - host: jarvis.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: jarvis-core, port: { number: 8080 } }
